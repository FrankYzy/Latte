# Legacy Conda environment retained for reference.
# The canonical environment is managed by uv via pyproject.toml and uv.lock.
name: latte
channels:
  - pytorch
  - nvidia
dependencies:
  - python >= 3.10
  - pytorch > 2.0.0
  - torchvision
  - pytorch-cuda >= 11.7
  - pip:
    - timm
    - diffusers[torch]==0.24.0
    - accelerate
    - tensorboard
    - einops
    - transformers
    - av
    - scikit-image
    - pandas
    - imageio-ffmpeg
    - sentencepiece
    - beautifulsoup4
    - ftfy
    - omegaconf
